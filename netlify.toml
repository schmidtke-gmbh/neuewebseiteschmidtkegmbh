[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fallstudie Chemnitz umbenannt (22.10.2026): alte Adresse dauerhaft weiterleiten
[[redirects]]
  from = "/case-fischer"
  to = "/fallstudie-fischer-kampfsportschule-chemnitz"
  status = 301

[[redirects]]
  from = "/case-fischer.html"
  to = "/fallstudie-fischer-kampfsportschule-chemnitz"
  status = 301

# Interne Dateien nicht ausliefern (11.11.2026). Funktionen laufen weiter unter /.netlify/functions/.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/foerderung/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/strategie-seo-geo"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/strategie-seo-geo.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

# Alte Startseite und .html-Adressen dauerhaft auf die Adresse ohne Endung leiten (11.11.2026)
[[redirects]]
  from = "/index-v4"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index-v4.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/foerderung/index.html"
  to = "/foerderung/"
  status = 301
  force = true

